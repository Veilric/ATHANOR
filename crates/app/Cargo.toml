[package]
name = "athanor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["native-ui"]
native-ui = ["dep:rune", "dep:arboard", "dep:tray-icon", "dep:x11rb", "dep:zbus", "dep:tokio", "dep:futures-util"]

[dependencies]
serde = { version = "1", features = ["derive"] }
athanor-core = { path = "../core" }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
directories = "6"
notify = "8"
getrandom = "0.4"
ureq = { version = "=3.5.1", default-features = false, features = ["rustls", "json"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "bb310fc9e2c4a1a1937814c71efc08924a5c2885", optional = true, default-features = false, features = ["accessibility", "dbus", "metal-backend", "svg", "native-file-dialog"] }
arboard = { version = "3.7", optional = true, default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "athanor"
path = "src/main.rs"

[[bin]]
name = "athanor-probe"
path = "src/bin/athanor-probe.rs"
required-features = ["native-ui"]

[target.'cfg(target_os="linux")'.dependencies]
x11rb = { version = "0.13", optional = true, features = ["randr"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"], optional = true }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"], optional = true }
futures-util = { version = "0.3", optional = true }

[target.'cfg(target_os="macos")'.dependencies]
tray-icon = { version = "=0.26.1", optional = true, default-features = false }
